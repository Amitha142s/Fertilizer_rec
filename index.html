<!DOCTYPE html>
<html>

<head>

    <title>Fertilizer Recommendation</title>

    <style>

        body{
            font-family:Arial;
            background:#e8f5e9;
            text-align:center;
            padding:40px;
        }

        input, select{
            width:250px;
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 20px;
            background:green;
            color:white;
            border:none;
        }

        .result{
            margin-top:20px;
            padding:15px;
            display:inline-block;
            background:#ffffff;
            border-radius:8px;
            box-shadow:0 2px 6px rgba(0,0,0,0.1);
            font-weight:600;
        }

    </style>

</head>

<body>

    <h1>🌱 Fertilizer Recommendation System</h1>

    <form action="/predict" method="POST">

        <input type="number" step="0.01" name="Temperature" placeholder="Temperature (e.g. 24.5)"><br>

        <input type="number" step="0.01" name="Humidity" placeholder="Humidity (e.g. 65.2)"><br>

        <input type="number" step="0.01" name="Rainfall" placeholder="Rainfall (e.g. 1200.5)"><br>

        <input type="number" step="0.01" name="Soil_Moisture" placeholder="Soil Moisture (e.g. 30.5)"><br>

        <input type="number" step="1" name="Nitrogen_Level" placeholder="Nitrogen Level (e.g. 50)"><br>

        <input type="number" step="1" name="Phosphorus_Level" placeholder="Phosphorus Level (e.g. 40)"><br>

        <input type="number" step="1" name="Potassium_Level" placeholder="Potassium Level (e.g. 80)"><br>

        <input type="number" step="0.01" name="Soil_pH" placeholder="Soil pH (e.g. 6.5)"><br>

        <select name="Soil_Type">
            <option value="">-- Select Soil Type --</option>
            {% for opt in soil_options %}
            <option value="{{ opt }}">{{ opt }}</option>
            {% endfor %}
        </select><br>

        <select name="Crop_Type">
            <option value="">-- Select Crop Type --</option>
            {% for opt in crop_options %}
            <option value="{{ opt }}">{{ opt }}</option>
            {% endfor %}
        </select><br>

        <select name="Region">
            <option value="">-- Select Region --</option>
            {% for opt in region_options %}
            <option value="{{ opt }}">{{ opt }}</option>
            {% endfor %}
        </select><br>

        <button type="submit">Predict</button>

    </form>

    {% if prediction_text %}
        <div class="result">{{ prediction_text }}</div>
    {% endif %}

</body>

</html>
